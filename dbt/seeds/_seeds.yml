version: 2

seeds:
  - name: seed_agency_codes
    description: >
      Accepted NYC agency acronyms (dictionary "Agency" + Hidden_Agencies sheet).
      Non-exhaustive — update when NYC adds an agency. Used by a warn-severity
      relationships test on int_service_requests__cleaned.agency_code.
    columns:
      - name: agency_code
        tests: [unique, not_null]

  - name: seed_location_types
    description: >
      Accepted location-type values from the data dictionary (non-exhaustive).
      Used by a warn-severity relationships test on location_type.
    columns:
      - name: location_type
        tests: [unique, not_null]

  - name: seed_expected_source_columns
    description: >
      Schema-drift contract: the expected column list of NYC_311.SERVICE_REQUESTS_DLT.
      Compared against the live warehouse schema by
      tests/assert_source_schema_unchanged.sql. Update when an API/dlt schema
      change is reviewed and accepted.
    columns:
      - name: column_name
        tests: [unique, not_null]
