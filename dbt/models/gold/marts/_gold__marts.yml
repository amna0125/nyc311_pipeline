version: 2

models:
  - name: mart_daily_requests_by_borough_agency
    description: "Daily request volume & closure rate by borough/agency/complaint type."
    columns:
      - name: total_requests
        tests: [not_null]

  - name: mart_sla_resolution_performance
    description: "Monthly SLA/resolution metrics by agency & complaint type."
    columns:
      - name: created_month
        tests: [not_null]

  - name: mart_open_vs_closed_status
    description: "Backlog snapshot: open vs closed and overdue by borough/agency."
    columns:
      - name: total_requests
        tests: [not_null]
