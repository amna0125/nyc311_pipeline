name: "nyc311"
version: "1.0.0"
config-version: 2

# dbt Cloud manages the warehouse connection, so this profile name is nominal.
# (For local CLI runs, define a matching `nyc311` profile in ~/.dbt/profiles.yml.)
profile: "nyc311"

require-dbt-version: [">=1.7.0", "<2.0.0"]

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

# The project dir is a Windows bind mount that disallows directory rename/rmtree,
# which breaks `dbt deps`. Install packages off the mount, into the container's
# local filesystem. target-path and log-path are likewise redirected to /tmp via
# DBT_TARGET_PATH / DBT_LOG_PATH env vars in docker-compose.yml.
packages-install-path: "/tmp/dbt_packages"

clean-targets:
  - "target"
  - "/tmp/dbt_packages"

# ── Layer materializations & physical schemas ───────────────────────────────
# With dbt's default schema-generation, +schema appends to the connection's base
# schema (NYC_311) → NYC_311_BRONZE / NYC_311_SILVER / NYC_311_GOLD.
models:
  nyc311:
    bronze:
      +materialized: view
      +schema: bronze
      +tags: ["bronze"]
    silver:
      +materialized: view
      +schema: silver
      +tags: ["silver"]
    gold:
      +schema: gold
      +tags: ["gold"]
      dimensions:
        +materialized: table
      facts:
        +materialized: table
        fct_service_requests:
          +materialized: incremental
      marts:
        +materialized: table

seeds:
  nyc311:
    +schema: seeds
    seed_expected_source_columns:
      +column_types:
        column_name: varchar

# Store failing test rows as tables for triage at NYC-311 volume.
tests:
  nyc311:
    +store_failures: true
    +schema: dq_failures

# ── NYC geo bounding box + history start, referenced via var() ───────────────
vars:
  nyc_lat_min: 40.40
  nyc_lat_max: 41.10
  nyc_lon_min: -74.30
  nyc_lon_max: -73.65
  request_min_date: "2020-01-01"
