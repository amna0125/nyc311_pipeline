version: 2

models:
  - name: int_service_requests__cleaned
    description: >
      Silver step 1: sentinel-scrubbed, standardized service requests. Controlled
      vocabularies (borough, status, channel, address_type, road_ramp) are
      canonical UPPER; ZIP and geo coordinates are structurally validated.
    columns:
      - name: service_request_id
        tests: [unique, not_null]

      # ── Closed value sets → severity: error ────────────────────────────
      - name: borough
        description: "Canonical NYC borough (submitter borough, falling back to park borough)."
        tests:
          - not_null
          - accepted_values:
              values: ["BRONX", "BROOKLYN", "MANHATTAN", "QUEENS", "STATEN ISLAND", "UNSPECIFIED"]
              config:
                severity: error
                tags: ["integrity"]
      - name: address_type
        description: >
          How the incident location was described. The dictionary lists a fixed
          set, but real data carries extra variants, so this is warn (surfaces
          new values without blocking). Re-tighten to error once the list is
          reconciled against NYC_311_DQ_FAILURES.
        tests:
          - accepted_values:
              values: ["ADDRESS", "BLOCK FACE", "BLOCKFACE", "INTERSECTION", "LATLONG", "PLACENAME"]
              config:
                severity: warn
                tags: ["integrity"]
      - name: road_ramp
        description: >
          Bridge/Highway: roadway vs ramp. Dictionary lists Roadway/Ramp only,
          but real data carries extra values, so this is warn. Re-tighten to
          error once the accepted list is reconciled.
        tests:
          - accepted_values:
              values: ["ROADWAY", "RAMP"]
              config:
                severity: warn
                tags: ["integrity"]
      - name: channel_type
        description: "How the request was submitted (closed set; added 2018)."
        tests:
          - accepted_values:
              values: ["PHONE", "ONLINE", "MOBILE", "OTHER", "UNKNOWN"]
              config:
                severity: error
                tags: ["integrity"]

      # ── Evolving / non-exhaustive sets → severity: warn ────────────────
      - name: status
        description: "Request status. Dictionary marks this open-ended ('+')."
        tests:
          - not_null
          - accepted_values:
              values: ["ASSIGNED", "CANCELED", "CANCELLED", "CLOSED", "PENDING",
                       "OPEN", "IN PROGRESS", "STARTED", "DRAFT", "UNSPECIFIED"]
              config:
                severity: warn
                tags: ["integrity"]
      - name: facility_type
        description: "City facility type (small but evolving set)."
        tests:
          - accepted_values:
              values: ["DSNY Garage", "Precinct", "School", "School District", "N/A"]
              config:
                severity: warn
                tags: ["integrity"]
      - name: agency_code
        description: "Responding agency acronym. Dictionary: non-exhaustive."
        tests:
          # relationships-to-seed acts as a warn-only accepted_values against
          # the maintained seed_agency_codes list.
          - relationships:
              to: ref('seed_agency_codes')
              field: agency_code
              config:
                severity: warn
                tags: ["integrity"]
      - name: location_type
        description: "Type of incident location. Dictionary: non-exhaustive."
        tests:
          - relationships:
              to: ref('seed_location_types')
              field: location_type
              config:
                severity: warn
                tags: ["integrity"]

      # ── Structural format tests (field limitations) ───────────────────
      - name: incident_zip
        description: "5-digit ZIP or NULL (invalid values nulled in cleaning)."
        tests:
          - dbt_expectations.expect_column_values_to_match_regex:
              regex: "^[0-9]{5}$"
              config:
                where: "incident_zip is not null"
                severity: error
                tags: ["integrity"]
      - name: bbl
        description: "10-digit Borough-Block-Lot; first digit is borough 1-5."
        tests:
          - dbt_expectations.expect_column_values_to_match_regex:
              regex: "^[1-5][0-9]{9}$"
              config:
                where: "bbl is not null"
                severity: warn
                tags: ["integrity"]
      - name: latitude
        description: "Decimal-degree latitude, validated to the NYC bounding box."
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 40.40
              max_value: 41.10
              config:
                where: "has_valid_geo = true"
                severity: error
                tags: ["integrity"]
      - name: longitude
        description: "Decimal-degree longitude, validated to the NYC bounding box."
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: -74.30
              max_value: -73.65
              config:
                where: "has_valid_geo = true"
                severity: error
                tags: ["integrity"]
      - name: x_coordinate_state_plane
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              inclusive: false
              config:
                where: "x_coordinate_state_plane is not null"
                severity: warn
                tags: ["integrity"]
      - name: y_coordinate_state_plane
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              inclusive: false
              config:
                where: "y_coordinate_state_plane is not null"
                severity: warn
                tags: ["integrity"]
      - name: community_board
        tests:
          - dbt_expectations.expect_column_values_to_match_regex:
              regex: "^[0-9]"
              config:
                where: "community_board is not null"
                severity: warn
                tags: ["integrity"]

  - name: int_service_requests__enriched
    description: >
      Silver step 2: conformed, analytics-ready grain (one row per request) with
      derived measures (resolution_time_hours), SLA flags, and created-date parts.
      Source of the gold dimensions and fact.
    columns:
      - name: service_request_id
        tests: [unique, not_null]
      - name: resolution_time_hours
        description: "Hours from creation to closure; NULL when open."
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              inclusive: true
              config:
                where: "resolution_time_hours is not null"
                severity: error
                tags: ["integrity"]
      - name: created_year
        tests:
          - not_null
    tests:
      # ── Cross-field / business-rule tests ──────────────────────────────
      # Known NYC 311 artifact: some rows have closed_at < created_at. The
      # enriched model already nulls resolution_time_hours for these, so it does
      # not corrupt metrics — surface it as a warning rather than block gold.
      - dbt_utils.expression_is_true:
          expression: "closed_at >= created_at"
          config:
            where: "closed_at is not null"
            severity: warn
            tags: ["integrity"]
          name: enriched_closed_after_created
      - dbt_utils.expression_is_true:
          expression: "created_at <= current_timestamp::timestamp_ntz"
          config:
            severity: error
            tags: ["integrity"]
          name: enriched_created_not_in_future
      - dbt_utils.expression_is_true:
          expression: "due_at >= created_at"
          config:
            where: "due_at is not null"
            severity: warn
            tags: ["integrity"]
          name: enriched_due_after_created
      - dbt_utils.expression_is_true:
          expression: "complaint_type is not null"
          config:
            where: "descriptor is not null"
            severity: warn
            tags: ["integrity"]
          name: enriched_descriptor_requires_complaint_type
