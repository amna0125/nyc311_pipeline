version: 2

models:
  - name: fct_service_requests
    description: >
      Wide fact at one row per service request. Descriptive attributes are
      degenerate dimensions on the fact itself; the only star join is to dim_date
      via created_date_sk.
    columns:
      - name: service_request_id
        tests: [unique, not_null]
      - name: created_date_sk
        tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_sk
      - name: borough
        tests: [not_null]
      - name: status
        tests: [not_null]
      - name: request_count
        tests: [not_null]
